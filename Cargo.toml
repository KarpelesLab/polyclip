# The cargo-fuzz crate under `fuzz/` (nightly + libFuzzer) is built separately
# with `cargo +nightly fuzz run <target>`, and `oracle/` (differential tests against
# Clipper2, which needs a C++ compiler) is its own crate too; keep both out of the
# implicit workspace.
[workspace]
exclude = ["fuzz", "oracle"]

[package]
name = "polyclip"
version = "0.0.5"
edition = "2024"
rust-version = "1.89"
description = "Exact integer 2D polygon geometry: booleans, offsetting, arcs, distance queries, fracture, triangulation."
repository = "https://github.com/KarpelesLab/polyclip"
license = "MIT"
keywords = ["polygon", "clipping", "geometry", "offset", "boolean"]
categories = ["algorithms", "graphics", "mathematics"]
exclude = [".github", "fuzz", "oracle", "testdata"]

[package.metadata.docs.rs]
all-features = true

[features]
default = []
serde = ["dep:serde"]
rayon = ["dep:rayon"]

[dependencies]
# Pure-Rust libm: identical transcendental results on every platform, which
# keeps arc approximation bit-for-bit deterministic.
libm = "0.2"
serde = { version = "1", features = ["derive"], optional = true }
rayon = { version = "1", optional = true }

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
# Benchmarks only (never a library dependency). 0.8 needs Rust 1.86, within our MSRV.
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "workloads"
harness = false

[profile.release]
debug = "line-tables-only"
