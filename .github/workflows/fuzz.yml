name: Fuzz

# Coverage-guided fuzzing via cargo-fuzz / libFuzzer. Requires nightly
# Rust, so this runs out-of-band from the stable CI: weekly on Monday at
# 05:47 UTC, plus on manual dispatch. Crashes are uploaded as workflow
# artifacts so they can be decoded (POLYCLIP_FUZZ_DEBUG=1, see
# fuzz/README.md) into tests/fuzz_regressions.rs and the per-target seed
# corpus.
#
# The targets and the `fuzz/` crate they live in are intentionally
# excluded from the main Cargo workspace, so nothing here affects the
# day-to-day stable build.

on:
  workflow_dispatch:
    inputs:
      duration:
        description: "Seconds to fuzz each target"
        default: "60"
        required: false
  schedule:
    # Weekly. Offset off the hour so we don't pile onto the :00 cron rush.
    - cron: "47 5 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - boolean
          - clip_paths
          - offset
          - offset_paths
          - arc
          - query
          - validate
          - polygon_tools
          - distance
    steps:
      - uses: actions/checkout@v6

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          # Keyed per target so libFuzzer's instrumented build cache
          # survives across matrix entries.
          workspaces: fuzz
          key: fuzz-${{ matrix.target }}

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      # Debug assertions and overflow checks stay on (cargo-fuzz default):
      # an arithmetic overflow or a failed internal invariant is a bug.
      - name: Run ${{ matrix.target }}
        run: |
          DURATION="${{ github.event.inputs.duration || '60' }}"
          cd fuzz
          cargo +nightly fuzz run "${{ matrix.target }}" \
            -- -max_total_time="$DURATION" -timeout=30 -print_final_stats=1

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes-${{ matrix.target }}
          path: |
            fuzz/artifacts/${{ matrix.target }}/
          retention-days: 30
          if-no-files-found: ignore
